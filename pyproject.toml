[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vexpoly"
version = "3.4.1"
description = "A pure-Python software-rendered first-person arena shooter."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "dranimalis" }]
keywords = ["game", "fps", "pygame", "software-renderer", "indie-game"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: First Person Shooters",
]
dependencies = ["pygame-ce>=2.5.0"]

[project.urls]
Homepage = "https://github.com/dranimalis/vexpoly"
Repository = "https://github.com/dranimalis/vexpoly"
Issues = "https://github.com/dranimalis/vexpoly/issues"
Changelog = "https://github.com/dranimalis/vexpoly/blob/main/CHANGELOG.md"

[project.scripts]
vexpoly = "vexpoly:main"

[tool.setuptools]
py-modules = ["vexpoly"]

[tool.setuptools.package-data]
"*" = ["assets/**/*", "docs/**/*"]