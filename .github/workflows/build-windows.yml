name: Build Windows

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: >
          pyinstaller
          --onefile
          --windowed
          --name vexpoly
          --add-data "assets;assets"
          --add-data "docs;docs"
          --icon docs/logo-mark-solid.png
          --noconfirm
          vexpoly.py

      - name: Rename to release filename
        shell: pwsh
        run: |
          Move-Item dist\vexpoly.exe dist\vexpoly-win64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vexpoly-win64
          path: dist/vexpoly-win64.exe

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/vexpoly-win64.exe