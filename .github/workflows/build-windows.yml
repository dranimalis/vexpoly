name: Build Windows

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Build icon (.ico)
        run: |
          python -c "from PIL import Image; img = Image.open('docs/logo-mark-solid.png').convert('RGBA'); img.save('vexpoly.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Build executable
        run: |
          pyinstaller --onefile --windowed --name vexpoly --add-data "assets;assets" --icon "vexpoly.ico" --noconfirm vexpoly.py

      - name: Rename to release filename
        shell: pwsh
        run: Move-Item dist\vexpoly.exe dist\vexpoly-win64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vexpoly-win64
          path: dist/vexpoly-win64.exe

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/vexpoly-win64.exe