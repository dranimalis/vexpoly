name: Build Linux

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libfuse2 wget

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller \
            --onefile \
            --windowed \
            --name vexpoly \
            --add-data "assets:assets" \
            --noconfirm \
            vexpoly.py

      - name: Build AppDir
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp dist/vexpoly AppDir/usr/bin/vexpoly
          chmod +x AppDir/usr/bin/vexpoly
          cp docs/logo-mark-solid.png AppDir/usr/share/icons/hicolor/256x256/apps/vexpoly.png
          cp docs/logo-mark-solid.png AppDir/vexpoly.png

          cat > AppDir/vexpoly.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=VEXPOLY
          Comment=A first-person arena shooter written in Python
          Exec=vexpoly
          Icon=vexpoly
          Categories=Game;ActionGame;
          Terminal=false
          EOF

          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/vexpoly" "$@"
          EOF
          chmod +x AppDir/AppRun

      - name: Fetch appimagetool
        run: |
          wget -q -O appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

      - name: Build AppImage
        run: ARCH=x86_64 ./appimagetool --no-appstream AppDir vexpoly-x86_64.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vexpoly-appimage
          path: vexpoly-x86_64.AppImage

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: vexpoly-x86_64.AppImage