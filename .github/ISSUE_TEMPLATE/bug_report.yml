name: Bug report
description: Something is broken or crashes
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. The more of this you can
        fill in, the faster it gets fixed.
  - type: input
    id: version
    attributes:
      label: Version
      description: The version shown in the menu footer, or the git commit hash.
      placeholder: "3.4.1"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 / Ubuntu 24.04 / macOS 14"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.4"
    validations:
      required: true
  - type: input
    id: pygame
    attributes:
      label: pygame or pygame-ce version
      description: "Run `python -c \"import pygame; print(pygame.version.ver)\"`"
      placeholder: "2.5.8"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the bug. Screenshots or a short clip help a lot.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a Survival run on Hard
        2. Pick the shotgun
        3. Walk into the north-west corner
        4. ...
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Traceback or console output
      description: If it crashed, paste the full traceback.
      render: shell
    validations:
      required: false