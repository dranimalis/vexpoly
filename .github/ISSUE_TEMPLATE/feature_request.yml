name: Feature request
description: Suggest a new feature or change
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before you write it out, skim
        [ROADMAP.md](../../blob/main/ROADMAP.md). It might already be planned.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the gameplay or workflow pain point, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
      description: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Renderer and performance
        - Gameplay and balance
        - New content (enemy, weapon, theme)
        - UI and UX
        - Audio
        - Tooling and build
        - Something else
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: This does not add a new third-party dependency
        - label: This does not require a non-pygame rendering library